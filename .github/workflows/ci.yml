name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Checkout shared submodule (read-only deploy key)
        env:
          SHARED_SSH_KEY: ${{ secrets.SHARED_SSH_KEY }}
        run: |
          key="$RUNNER_TEMP/shared_key"
          (umask 077; printf '%s\n' "$SHARED_SSH_KEY" > "$key")
          ssh-keyscan github.com > "$RUNNER_TEMP/known_hosts" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts -o StrictHostKeyChecking=yes"
          git submodule update --init --recursive
          rm -f "$key"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Gate
        run: ./check.sh
      - name: Upload debug APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: car-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 3
          if-no-files-found: error
      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-reports
          retention-days: 3
          if-no-files-found: ignore
          path: |
            **/build/paparazzi/failures/**
            **/build/reports/tests/**
